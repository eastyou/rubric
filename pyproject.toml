[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rubric"
version = "0.1.0"
description = "评分量规：维度,等级 CSV 一键生成 A4 可打印评价表"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["rubric", "assessment", "teacher", "education", "print", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]

[project.scripts]
rubric = "rubric.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/rubric"
Source = "https://github.com/eastyou/rubric"

[tool.setuptools]
packages = ["rubric"]
