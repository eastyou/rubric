name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test rubric generation
        run: |
          python -m rubric -i examples/作文量规.csv --task 写人作文 -o rubric.html
          python -c "print(open('rubric.html', encoding='utf-8').read().count('<tr>'))"
          python -c "print(open('rubric.html', encoding='utf-8').read().count('A4 landscape'))"
          python -c "print(open('rubric.html', encoding='utf-8').read().count('写人作文'))"
